<style>
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0deg)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.rain{animation:rain 4s linear infinite}
@keyframes rain{0%{transform:translate(0,-110px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(-150px,310px);opacity:0}}
.wave{animation:wave 9s linear infinite}
@keyframes wave{to{transform:translateX(-600px)}}
@media (prefers-reduced-motion:reduce){.float,.blink,.tw,.rain,.wave{animation:none}}
</style>
